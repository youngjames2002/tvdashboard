<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcoming Events</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='1' y='1' width='14' height='4' fill='%231a1aff'/%3E%3Crect x='3' y='2' width='10' height='2' fill='%23ffff2a'/%3E%3Crect x='1' y='7' width='3' height='2' fill='%232aff2a'/%3E%3Crect x='5' y='7' width='10' height='2' fill='%23f4f4f4'/%3E%3Crect x='1' y='10' width='3' height='2' fill='%232aff2a'/%3E%3Crect x='5' y='10' width='7' height='2' fill='%23f4f4f4'/%3E%3Crect x='1' y='13' width='3' height='2' fill='%23ff2a2a'/%3E%3Crect x='5' y='13' width='3' height='2' fill='%232aff2a'/%3E%3Crect x='9' y='13' width='3' height='2' fill='%23ffff2a'/%3E%3Crect x='13' y='13' width='2' height='2' fill='%232affff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* The teletext palette: eight colours, nothing in between */
  :root {
    --black: #000;
    --red: #ff2a2a;
    --green: #2aff2a;
    --yellow: #ffff2a;
    --blue: #1a1aff;
    --cyan: #2affff;
    --white: #f4f4f4;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--black); }
  body {
    color: var(--white);
    font-family: "VT323", ui-monospace, monospace;
    font-size: 6.5vh;            /* ~14 rows on screen: readable from across the room */
    overflow: hidden;            /* never show a scrollbar on the TV */
    line-height: 1.1;
    display: flex;
    justify-content: center;
    padding: 3vh 2vw;
    text-shadow: 0 0 0.15em currentColor;   /* phosphor glow */
  }
  /* CRT scanlines and vignette, laid over everything */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.35) 2px 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.65) 100%);
  }
  .page { width: 100%; max-width: 90ch; }
  .row { white-space: nowrap; overflow: hidden; }

  .header { display: flex; gap: 1ch; }
  .header .page-no { color: var(--white); }
  .header .service { color: var(--cyan); }
  .header .date { margin-left: auto; color: var(--white); }
  .header .clock { color: var(--yellow); }

  /* Double-height title band: same width, twice as tall, as teletext did it */
  .title {
    background: var(--blue);
    color: var(--yellow);
    height: 2.2em;
    margin: 0.6em 0 0.8em;
    padding-left: 1ch;
  }
  .title span { display: inline-block; transform: scaleY(2); transform-origin: top; }

  .day { color: var(--cyan); margin-top: 0.6em; }
  .day.today { color: var(--yellow); }
  .event { display: grid; grid-template-columns: 8ch 1fr; }
  .event .time { color: var(--green); }
  .event .now { animation: flash 1s steps(1) infinite; }
  .empty { color: var(--white); }

  .footer { display: flex; align-items: center; gap: 2ch; margin-top: 1em; }
  .status { color: var(--green); }
  /* Styled like a fastext key: solid red block, black text */
  .refresh {
    font: inherit;
    background: var(--red);
    color: var(--black);
    text-shadow: none;
    border: 0;
    padding: 0 1ch;
    cursor: pointer;
  }
  .refresh:focus-visible { outline: 0.12em solid var(--white); outline-offset: 0.12em; }
  .refresh:disabled { opacity: 0.5; cursor: wait; }
  .status.error { color: var(--red); }

  @keyframes flash { 50% { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .event .now { animation: none; } }
</style>
</head>
<body>
<div class="page">
  <div class="row header">
    <span class="page-no">P101</span>
    <span class="service">Calendar</span>
    <span class="date" id="date"></span>
    <span class="clock" id="clock"></span>
  </div>
  <div class="row title"><span>Upcoming Events</span></div>
  <div id="events"></div>
  <div class="row footer">
    <button class="refresh" id="refresh" type="button">Refresh</button>
    <span class="status" id="status">Searching for page 101…</span>
  </div>
</div>

<script>
const REFRESH_MS = 5 * 60 * 1000;
const MAX_EVENTS = 6; // what fits on screen at this text size
const fmtTime = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit" });
const fmtClock = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const fmtHeaderDate = new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "2-digit", month: "short" });
const fmtDay = new Intl.DateTimeFormat("en-GB", { weekday: "long", day: "numeric", month: "long" });

function tick() {
  const now = new Date();
  document.getElementById("date").textContent = fmtHeaderDate.format(now).replace(",", "");
  document.getElementById("clock").textContent = fmtClock.format(now);
}

function parseStart(ev) {
  if (!ev.all_day) return new Date(ev.start);
  const [y, m, d] = ev.start.split("-").map(Number);
  return new Date(y, m - 1, d); // all-day dates are local, not UTC
}

function dayLabel(date) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(date).setHours(0, 0, 0, 0) - today) / 86400000);
  if (diff <= 0) return "Today";
  if (diff === 1) return "Tomorrow";
  return fmtDay.format(date);
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text) node.textContent = text; // textContent, so event titles can't inject HTML
  return node;
}

function render(events) {
  const list = document.getElementById("events");
  list.replaceChildren();
  if (!events.length) {
    list.append(el("div", "row empty", "Nothing on in the next 30 days"));
    return;
  }
  const now = new Date();
  let currentDay = null;
  for (const ev of events) {
    const start = parseStart(ev);
    const label = dayLabel(start);
    if (label !== currentDay) {
      list.append(el("div", "row day" + (label === "Today" ? " today" : ""), label));
      currentDay = label;
    }
    const ongoing = !ev.all_day && start < now;
    const time = ev.all_day ? "All day" : ongoing ? "Now" : fmtTime.format(start);
    const row = el("div", "row event");
    row.append(el("span", "time" + (ongoing ? " now" : ""), time), el("span", "", ev.summary));
    list.append(row);
  }
}

async function load() {
  const status = document.getElementById("status");
  const button = document.getElementById("refresh");
  if (button.disabled) return; // a fetch is already running
  button.disabled = true;
  status.textContent = "Searching…";
  try {
    const res = await fetch(`/events?limit=${MAX_EVENTS}`);
    if (!res.ok) throw new Error(`server returned ${res.status}`);
    render(await res.json());
    status.className = "status";
    status.textContent = "";
  } catch (err) {
    status.className = "status error";
    status.textContent = `No signal: ${err.message}. Retrying in 5 min`;
  } finally {
    button.disabled = false;
  }
}

document.getElementById("refresh").addEventListener("click", load);
// "R" on a keyboard, or the red colour key on remotes that pass it through (keyCode 403)
document.addEventListener("keydown", (e) => {
  if (e.key === "r" || e.key === "R" || e.key === "ColorF0Red" || e.keyCode === 403) load();
});

tick();
setInterval(tick, 1000);
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
