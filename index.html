<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pascal@homeserver</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23020a1a'/%3E%3Cpath d='M3 5l3 3-3 3' fill='none' stroke='%236cc8ff' stroke-width='1.6'/%3E%3Crect x='8' y='10' width='5' height='1.6' fill='%23d8f1ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* Blue-phosphor CRT: one hue, three intensities */
  :root {
    --bg: #020a1a;
    --phos: #6cc8ff;
    --bright: #d8f1ff;
    --dim: #2f5f99;
    --faint: rgba(108, 200, 255, 0.14);
  }
  html { font-size: 3.4vh; }  /* scales with the screen; ~37px base on 1080p */
  * { box-sizing: border-box; margin: 0; }
  body {
    height: 100vh;
    overflow: hidden;
    background: #000;
    color: var(--phos);
    font-family: "VT323", ui-monospace, monospace;
    font-size: 1.25rem;
    line-height: 1.15;
  }

  /* ---- The tube ---- */
  .screen {
    position: relative;
    height: 100vh;
    padding: 3vh 3.5vw;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 2vh;
    background: radial-gradient(ellipse at 50% 45%, #06204a 0%, var(--bg) 70%);
    border-radius: 2.2rem / 1.8rem;  /* rounded glass corners */
    box-shadow: inset 0 0 6rem rgba(0, 0, 0, 0.9), inset 0 0 1.2rem rgba(108, 200, 255, 0.15);
    text-shadow: 0 0 0.12em currentColor, 0 0 0.45em rgba(108, 200, 255, 0.45);
    overflow: hidden;
  }
  .screen::before {  /* scanlines */
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.32) 0 2px, transparent 2px 4px);
    z-index: 2;
  }
  .screen::after {  /* slow refresh band rolling down the glass */
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 25vh;
    top: -25vh;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent, rgba(108, 200, 255, 0.05), transparent);
    animation: roll 9s linear infinite;
    z-index: 3;
  }

  .prompt { color: var(--dim); white-space: nowrap; }
  .prompt .host { color: var(--phos); }
  .prompt .cmd { color: var(--bright); }

  /* ---- Header: `date` on the left, music player on the right ---- */
  header { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5vw; align-items: end; }
  .music { min-width: 0; text-align: right; }
  .music .line { font-size: 1.5rem; color: var(--bright); }
  .note { color: var(--phos); }
  #trackstate:empty { display: none; }
  #trackstate { margin-right: 1ch; font-size: 1.1rem; vertical-align: middle; }
  .clock { display: flex; align-items: baseline; gap: 1.2ch; color: var(--bright); }
  .clock .hhmm { font-size: 3.4rem; line-height: 1; }
  .clock .ss { font-size: 1.8rem; color: var(--phos); }
  .clock .date { font-size: 1.8rem; color: var(--phos); margin-left: 1ch; }

  /* ---- Two panes, tmux-split style ---- */
  main { display: grid; grid-template-columns: 1.25fr 1fr; gap: 2.5vw; min-height: 0; }
  .pane {
    position: relative;
    min-height: 0;
    padding: 1.1rem 1.2ch 0.6rem;
    border: 0.12rem solid var(--dim);
    box-shadow: 0 0 0.8rem rgba(108, 200, 255, 0.12), inset 0 0 0.8rem rgba(108, 200, 255, 0.06);
    display: flex;
    flex-direction: column;
  }
  /* Safety net: anything that doesn't fit is clipped inside the box, never spills out */
  #events, #sports { flex: 1; min-height: 0; overflow: hidden; }
  .pane-title {
    position: absolute;
    top: -0.62em;
    left: 1.5ch;
    padding: 0 1ch;
    background: var(--bg);
    color: var(--bright);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .pane .prompt { margin-bottom: 0.4rem; }
  .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .day { color: var(--bright); margin-top: 0.45rem; }
  .day::before { content: "## "; color: var(--dim); }
  .event .time { display: inline-block; width: 8ch; color: var(--phos); }
  .event .title { color: var(--bright); }
  .now { animation: blink 1s steps(1) infinite; }
  .inverse { background: var(--phos); color: var(--bg); text-shadow: none; padding: 0 0.5ch; }

  .team { margin-bottom: 0.55rem; }
  .team-name { color: var(--bright); text-transform: uppercase; letter-spacing: 0.05em; }
  .team-name .stale { color: var(--dim); text-transform: none; }
  .team .line { padding-left: 2ch; }
  .key { display: inline-block; width: 5ch; color: var(--dim); }
  .res { display: inline-block; width: 3ch; text-align: center; margin-right: 1ch; }
  .res.L { color: var(--dim); }
  .res.D { outline: 1px solid var(--phos); }
  .muted { color: var(--dim); }

  /* ---- Footer: function key + live prompt ---- */
  footer { display: flex; align-items: center; gap: 2ch; white-space: nowrap; }
  .btn {
    font: inherit;
    color: var(--bright);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-shadow: inherit;
  }
  .btn:hover, .btn:focus-visible { background: var(--phos); color: var(--bg); text-shadow: none; outline: none; }
  .btn:disabled { color: var(--dim); cursor: wait; }
  .status { color: var(--dim); }
  .status.error { color: var(--bright); }
  .status.error::before { content: "ERR "; background: var(--bright); color: var(--bg); text-shadow: none; padding: 0 0.5ch; margin-right: 1ch; }
  .cursor { animation: blink 1.05s steps(1) infinite; color: var(--bright); }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes roll { to { top: 100vh; } }
  @media (prefers-reduced-motion: reduce) {
    .now, .cursor, .screen::after { animation: none; }
  }
</style>
</head>
<body>
<div class="screen">
  <header>
    <div>
      <div class="prompt"><span class="host">pascal@homeserver</span>:~$ <span class="cmd">date</span></div>
      <div class="clock">
        <span class="hhmm" id="hhmm">--:--</span><span class="ss" id="ss">:--</span>
        <span class="date" id="date"></span>
      </div>
    </div>
    <div class="music">
      <div class="prompt">$ <span class="cmd">mpv --shuffle --loop-playlist ~/music</span></div>
      <div class="line"><span class="inverse" id="trackstate"></span><span class="note">&#9834;</span> <span id="track">loading...</span></div>
    </div>
  </header>

  <main>
    <section class="pane">
      <span class="pane-title">Upcoming Events</span>
      <div class="prompt">$ <span class="cmd">cal --upcoming</span></div>
      <div id="events"><div class="muted">loading...</div></div>
    </section>
    <section class="pane">
      <span class="pane-title">Scores</span>
      <div class="prompt">$ <span class="cmd">espn --teams</span></div>
      <div id="sports"><div class="muted">loading...</div></div>
    </section>
  </main>

  <footer>
    <button class="btn" id="playpause" type="button">[P] play</button>
    <button class="btn" id="next" type="button">[N] next</button>
    <button class="btn" id="refresh" type="button">[F5] refresh</button>
    <span class="status" id="status"></span>
    <span class="prompt"><span class="host">pascal@homeserver</span>:~$ <span class="cursor">&#9608;</span></span>
  </footer>
</div>

<script>
const REFRESH_MS = 5 * 60 * 1000;
const MAX_EVENTS = 5;
const fmtTime = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit" });
const fmtDay = new Intl.DateTimeFormat("en-GB", { weekday: "long", day: "numeric", month: "long" });
const fmtShort = new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "2-digit", month: "short" });
const pad = (n) => String(n).padStart(2, "0");
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text) node.textContent = text; // textContent, so titles can't inject HTML
  return node;
}

function tick() {
  const now = new Date();
  $("hhmm").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  $("ss").textContent = `:${pad(now.getSeconds())}`;
  $("date").textContent = fmtShort.format(now).replace(",", "");
}

/* ---------- Calendar ---------- */
function parseStart(ev) {
  if (!ev.all_day) return new Date(ev.start);
  const [y, m, d] = ev.start.split("-").map(Number);
  return new Date(y, m - 1, d); // all-day dates are local, not UTC
}

function dayLabel(date) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(date).setHours(0, 0, 0, 0) - today) / 86400000);
  if (diff <= 0) return "Today";
  if (diff === 1) return "Tomorrow";
  return fmtDay.format(date);
}

function renderEvents(events) {
  const box = $("events");
  box.replaceChildren();
  if (!events.length) {
    box.append(el("div", "muted", "0 events in the next 30 days"));
    return;
  }
  const now = new Date();
  let currentDay = null;
  for (const ev of events) {
    const start = parseStart(ev);
    const label = dayLabel(start);
    if (label !== currentDay) {
      box.append(el("div", "line day", label));
      currentDay = label;
    }
    const ongoing = !ev.all_day && start < now;
    const time = el("span", "time");
    time.append(ongoing ? el("span", "inverse now", "NOW") : document.createTextNode(ev.all_day ? "all-day" : fmtTime.format(start)));
    const row = el("div", "line event");
    row.append(time, el("span", "title", ev.summary));
    box.append(row);
  }
}

/* ---------- Sports ---------- */
const vsAt = (g) => `${g.home ? "vs" : "@ "} ${g.opponent}`;

function lastLine(g) {
  const line = el("div", "line");
  line.append(el("span", "key", "last"));
  if (!g) { line.append(el("span", "muted", "-- no result --")); return line; }
  const res = el("span", "res " + (g.outcome || ""), g.outcome || "?");
  if (g.outcome === "W") res.classList.add("inverse");
  line.append(res, document.createTextNode(`${g.score_for}-${g.score_against}  ${vsAt(g)}`));
  return line;
}

function nextLine(g) {
  const line = el("div", "line");
  line.append(el("span", "key", "next"));
  if (!g) { line.append(el("span", "muted", "-- tbc --")); return line; }
  const d = new Date(g.date);
  line.append(document.createTextNode(`${fmtShort.format(d).replace(",", "")} ${fmtTime.format(d)}  ${vsAt(g)}`));
  return line;
}

function renderSports(data) {
  const box = $("sports");
  box.replaceChildren();
  for (const t of data.teams || []) {
    const block = el("div", "team");
    const name = el("div", "line team-name", t.short);
    if (t.stale) name.append(el("span", "stale", "  (stale)"));
    block.append(name, lastLine(t.last), nextLine(t.next));
    box.append(block);
  }
}

/* ---------- Music ---------- */
const VOLUME = 0.6;
const audio = new Audio();
audio.volume = VOLUME;
let tracks = [];          // from /playlist
let queue = [];           // what's left of the current shuffled loop
let current = null;
let errorsInRow = 0;
let playlistLoading = false;

function shuffle(list, notFirst) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  // don't play the same track twice in a row across a reshuffle
  if (a.length > 1 && notFirst && a[0].url === notFirst.url) [a[0], a[1]] = [a[1], a[0]];
  return a;
}

function setState(text) { $("trackstate").textContent = text; }
function updateButton() { $("playpause").textContent = audio.paused ? "[P] play" : "[P] pause"; }

async function tryPlay() {
  if (!current) return playNext();
  try {
    await audio.play();
  } catch (err) {
    if (err.name === "NotAllowedError") setState("AUTOPLAY BLOCKED: PRESS P");
  }
  updateButton();
}

async function playNext() {
  if (!queue.length) {
    // new loop: re-read the folder so newly added files join in, then reshuffle
    try { tracks = await getJSON("/playlist"); } catch { /* keep the old list */ }
    if (!tracks.length) { $("track").textContent = "no .mp3 files in MUSIC_DIR"; return; }
    queue = shuffle(tracks, current);
  }
  current = queue.shift();
  audio.src = current.url;
  $("track").textContent = current.name;
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: current.name });
  await tryPlay();
}

function togglePlay() {
  if (audio.paused) tryPlay(); else audio.pause();
}

async function loadPlaylist() {
  if (playlistLoading || tracks.length) return;
  playlistLoading = true;
  try {
    tracks = await getJSON("/playlist");
    queue = [];
    await playNext();
  } catch {
    $("track").textContent = "playlist unreachable";
  } finally {
    playlistLoading = false;
  }
}

audio.addEventListener("playing", () => { errorsInRow = 0; setState(""); updateButton(); });
audio.addEventListener("pause", () => { if (!audio.ended) setState("PAUSED"); updateButton(); });
audio.addEventListener("ended", playNext);
audio.addEventListener("error", () => {
  // skip unplayable files, but stop if every track has failed in a row
  if (++errorsInRow >= tracks.length) { setState("ALL TRACKS FAILED"); return; }
  playNext();
});

if ("mediaSession" in navigator) {
  // hardware/remote media keys arrive here rather than as keydown events
  navigator.mediaSession.setActionHandler("play", tryPlay);
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack", playNext);
}

/* ---------- Loading ---------- */
async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} returned ${res.status}`);
  return res.json();
}

async function load() {
  const button = $("refresh");
  if (button.disabled) return; // a fetch is already running
  button.disabled = true;
  const status = $("status");
  status.className = "status";
  status.textContent = "fetching...";

  const [events, sports] = await Promise.allSettled([getJSON(`/events?limit=${MAX_EVENTS}`), getJSON("/sports")]);
  const failed = [];
  if (events.status === "fulfilled") renderEvents(events.value); else failed.push("calendar");
  if (sports.status === "fulfilled") renderSports(sports.value); else failed.push("sports");

  loadPlaylist(); // no-op once tracks are loaded; retries each cycle if it failed
  status.textContent = failed.length ? `${failed.join(" + ")} unreachable` : "";
  status.classList.toggle("error", failed.length > 0);
  button.disabled = false;
}

$("refresh").addEventListener("click", load);
$("playpause").addEventListener("click", togglePlay);
$("next").addEventListener("click", playNext);
// F5 is intercepted so it refetches data instead of reloading the page; also "R" and the remote's red key (403)
document.addEventListener("keydown", (e) => {
  if (e.key === "F5") e.preventDefault();
  if (["F5", "r", "R", "ColorF0Red"].includes(e.key) || e.keyCode === 403) load();
  else if (e.key === "p" || e.key === "P") togglePlay();
  else if (e.key === "n" || e.key === "N") playNext();
});

tick();
setInterval(tick, 1000);
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
